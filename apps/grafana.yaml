apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: grafana

spec:
  project: monitoring-project

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 9.4.0

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: staging
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Shaabanyusuf/gitops-demo.git
    targetRevision: main
    path: .
    helm:
      valueFiles:
        - values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: prometheus

spec:
  project: monitoring-project

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 27.5.1

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd

spec:
  project: monitoring-project

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: 2.10.2

    helm:
      values: |
        promtail:
          config:
            snippets:
              extraRelabelConfigs:
                - action: keep
                  source_labels:
                    - __meta_kubernetes_namespace
                  regex: argocd|monitoring|dev|staging|prod

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: dev

spec:
  project: dev-project

  source:
    repoURL: https://github.com/Shaabanyusuf/gitops-demo.git
    targetRevision: main
    path: .

    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync-wave-demo-wave1
  namespace: dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sync-wave-demo-wave1
  template:
    metadata:
      labels:
        app: sync-wave-demo-wave1
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80

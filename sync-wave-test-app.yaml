apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sync-wave-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Shaabanyusuf/gitops-demo.git
    targetRevision: main
    path: sync-wave-test/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

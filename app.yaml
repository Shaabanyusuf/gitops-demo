apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: test-chart
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/shabaanyusuf/gitops-demo.git
    targetRevision: HEAD
    path: test-chart

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true


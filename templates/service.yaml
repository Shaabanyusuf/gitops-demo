apiVersion: v1
kind: Service

metadata:
  name: {{ include "test-chart.fullname" . }}

spec:
  type: {{ .Values.service.type }}

  selector:
    app: {{ include "test-chart.name" . }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
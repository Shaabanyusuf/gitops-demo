apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: {{ include "test-chart.fullname" . }}

subjects:
- kind: ServiceAccount
  name: {{ include "test-chart.fullname" . }}
  namespace: {{ .Release.Namespace }}

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "test-chart.fullname" . }}